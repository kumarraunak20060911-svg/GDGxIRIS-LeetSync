<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; margin: 0; background: #0f0f0f; color: #fff; }
    h2 { margin-top: 0; font-size: 18px; color: #ffa116; text-align: center; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
    .btn-auth { background: #238636; color: #fff; }
    .btn-auth:hover { background: #2ea043; }
    .btn-save { background: #ffa116; color: #000; }
    .btn-save:hover { background: #e08e10; }
    .input-group { margin-bottom: 12px; }
    label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
    input { width: 92%; padding: 8px; border-radius: 4px; border: 1px solid #333; background: #1a1a1a; color: #fff; }
    #status { font-size: 12px; margin-top: 10px; text-align: center; padding: 8px; border-radius: 4px; }
    .success { background: rgba(46, 160, 67, 0.2); color: #3fb950; }
    .error { background: rgba(248, 81, 73, 0.2); color: #f85149; }
  </style>
</head>
<body>
  <h2>LeetSync</h2>
  <button id="authBtn" class="btn btn-auth">Authenticate with GitHub</button>
  
  <div class="input-group">
    <label for="repoInput">Target GitHub Repository</label>
    <input type="text" id="repoInput" placeholder="username/my-leetcode-solutions">
  </div>
  
  <button id="saveBtn" class="btn btn-save">Save Settings</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
